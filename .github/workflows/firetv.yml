name: firetv
on:
  push:
    paths: ['firetv/**', '.github/workflows/firetv.yml']
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        working-directory: firetv
        run: ./gradlew --no-daemon assembleRelease
      - run: cp firetv/app/build/outputs/apk/release/app-release.apk DJFlix-FireTV.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DJFlix-FireTV-apk
          path: DJFlix-FireTV.apk
